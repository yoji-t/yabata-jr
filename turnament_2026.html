const toc = document.getElementById("tocLinks");

tournaments.forEach((item, index) => {
  const id = "tournament-" + (index + 1);

  const link = document.createElement("a");
  link.href = "#" + id;
  link.textContent = item.title;
  toc.appendChild(link);

  const article = document.createElement("article");
  article.className = "tournament" + (item.champion ? " champion" : "");
  article.id = id;

  const header = document.createElement("div");
  header.className = "tournament-header";

  const number = document.createElement("span");
  number.className = "number";
  number.textContent = String(index + 1).padStart(2, "0");

  const title = document.createElement("h3");
  title.textContent = item.title;

  header.appendChild(number);

  if (item.champion) {
    const crown = document.createElement("span");
    crown.className = "crown";
    crown.textContent = "★";
    header.appendChild(crown);
  }

  header.appendChild(title);
  article.appendChild(header);

  const body = document.createElement("div");
  body.className = "tournament-body";

  if (item.result) {
    const result = document.createElement("p");
    result.className = "result" + (item.champion ? " highlight" : "");
    result.textContent = item.result;
    body.appendChild(result);
  }

  if (item.image) {
    const bracket = document.createElement("div");
    bracket.className = "bracket";

    const imageLink = document.createElement("a");
    imageLink.href = item.image;
    imageLink.target = "_blank";
    imageLink.rel = "noopener noreferrer";
    imageLink.title = "トーナメント表を拡大して見る";

    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.title + " トーナメント表";
    img.loading = "lazy";

    imageLink.appendChild(img);
    bracket.appendChild(imageLink);

    const caption = document.createElement("div");
    caption.className = "image-caption";
    caption.textContent = "画像をクリックすると拡大表示できます";

    bracket.appendChild(caption);
    body.appendChild(bracket);

    const note = document.createElement("p");
    note.className = "no-result";
    note.textContent = "トーナメント表の画像はありません。";
    body.appendChild(note);
