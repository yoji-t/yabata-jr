}

.team-count {

  color: var(--blue);

.team-grid {

.team-card {

}

.team-card:hover {

}

.team-name {

  gap: 10px;

  font-size: 17px;
  font-weight: bold;
  margin-bottom: 16px;
}

  content: "";
  display: block;
  width: 5px;
  height: 23px;
  background: var(--gold);
  border-radius: 5px;
  flex-shrink: 0;
}

.links {

  flex-wrap: wrap;
  gap: 8px;
}

.links a {

  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border-radius: 6px;
  background: #f0f5fa;
  color: #315777;
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  transition: .2s;

.links a.facebook { background: #edf3ff; color: #1877f2; }
.links a.instagram:hover,
