function normScore(s){const m=s.replace(/[−–ー]/g,'-').match(/(\d+)\s*-\s*(\d+)/);return m?[+m[1],+m[2]]:[0,0]}function typeOf(g){return g.game.replace(/^\d{8}/,'').split('vs')[0].replace(/[①②]/g,'').trim()||'その他'}function monthOf(d){return d.slice(0,7)}const $=id=>document.getElementById(id);let monthlyChart,runsChart;function init(){[...new Set(games.map(g=>monthOf(g.date)))].forEach(m=>$('month').insertAdjacentHTML('beforeend',`<option value="${m}">${m}</option>`));[...new Set(games.map(typeOf))].sort().forEach(t=>$('type').insertAdjacentHTML('beforeend',`<option value="${t}">${t}</option>`));['search','month','result','type'].forEach(id=>$(id).addEventListener('input',render));render()}function filtered(){const q=$('search').value.toLowerCase();return games.filter(g=>($('month').value==='all'||monthOf(g.date)===$('month').value)&&($('result').value==='all'||g.result===$('result').value)&&($('type').value==='all'||typeOf(g)===$('type').value)&&(!q||[g.game,g.opponent,g.venue].join(' ').toLowerCase().includes(q)))}function aggCount(arr,key){return Object.entries(arr.reduce((a,g)=>(a[key(g)]=(a[key(g)]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])}
function renderBars(id, labels, a, b){const max=Math.max(1,...a.map((v,i)=>v+(b?b[i]:0)));document.getElementById(id).innerHTML=labels.map((lab,i)=>{const av=a[i]||0,bv=b?b[i]||0:0;return `<div class="rank"><b>${lab}</b><div class="bar"><span style="width:${(av+bv)/max*100}%;background:${b?'#46A171':'#2783DE'}"></span></div><span>${b?av+'勝 '+bv+'敗':av}</span></div>`}).join('')}function renderRanks(id,items){const max=items[0]?.[1]||1;$(id).innerHTML=items.slice(0,5).map(([n,c],i)=>`<div class="rank"><b>${i+1}. ${n}</b><div class="bar"><span style="width:${c/max*100}%"></span></div><span>${c}</span></div>`).join('')||'<span class="kpi-sub">該当なし</span>'}function render(){const data=filtered();const wins=data.filter(g=>g.result==='勝ち').length,losses=data.length-wins;let rf=0,ra=0;data.forEach(g=>{let [a,b]=normScore(g.score);rf+=a;ra+=b});$('record').textContent=`${wins}勝${losses}敗`;$('winRate').textContent=`勝率 ${data.length?(wins/data.length*100).toFixed(1):'0.0'}%`;$('runsFor').textContent=rf;$('runsAgainst').textContent=ra;$('avgFor').textContent=data.length?(rf/data.length).toFixed(1):'-';$('avgAgainst').textContent=data.length?(ra/data.length).toFixed(1):'-';const last=data.slice(-10),lw=last.filter(g=>g.result==='勝ち').length;$('last10').textContent=`${lw}勝${last.length-lw}敗`;let streak=0,sr='';for(let i=data.length-1;i>=0;i--){if(!sr)sr=data[i].result;if(data[i].result===sr)streak++;else break}$('streak').textContent=data.length?`${sr}${streak}試合中`:'-';$('shownCount').textContent=`${data.length}件表示`;$('tbody').innerHTML=data.slice().reverse().map(g=>`<tr><td>${g.date}</td><td>${g.game}</td><td><span class="status ${g.result==='勝ち'?'win':'loss'}">${g.result}</span></td><td>${g.opponent}</td><td><b>${g.score}</b></td><td>${g.venue}</td></tr>`).join('');renderRanks('opponents',aggCount(data,g=>g.opponent));renderRanks('venues',aggCount(data,g=>g.venue));drawCharts(data)}function drawCharts(data){const months=[...new Set(games.map(g=>monthOf(g.date)))];const win=months.map(m=>data.filter(g=>monthOf(g.date)===m&&g.result==='勝ち').length),loss=months.map(m=>data.filter(g=>monthOf(g.date)===m&&g.result==='負け').length);renderBars('monthlyChart',months,win,loss);const recent=data.slice(-12);renderBars('runsChart',recent.map(g=>g.date.slice(5)),recent.map(g=>normScore(g.score)[0]),null)}init();</script></body></html>
