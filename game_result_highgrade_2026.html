const tbody=document.getElementById("games");
const keyword=document.getElementById("keyword");
const outcome=document.getElementById("outcome");
const month=document.getElementById("month");

function render(){
 const q=keyword.value.toLowerCase();
 const rows=data.filter(g=>
  (!q||g.slice(1,3).join(" ").toLowerCase().includes(q))&&
  (!outcome.value||g[4]===outcome.value)&&
  (!month.value||g[0].slice(5,7)===month.value)
 );
 tbody.innerHTML=rows.map(g=>{
  const cls=g[4]==="勝ち"?"win":g[4]==="負け"?"lose":"draw";
  const date=g[0].split("-");
  return `<tr>
  <td>${date[0]}/${date[1]}/${date[2]}</td>
  <td class="game"><a href="https://app.notion.com/p/${g[6]}" target="_blank" rel="noopener">${g[1]}</a></td>
  <td>${g[2]}</td>
  <td class="score">${g[3]}</td>
  <td><span class="badge ${cls}">${g[4]}</span></td>
  <td>${g[5]}</td></tr>`;
 }).join("");
 document.getElementById("count").textContent=rows.length+"試合";
}
const wins=data.filter(g=>g[4]==="勝ち").length;
const losses=data.filter(g=>g[4]==="負け").length;
const draws=data.filter(g=>g[4]==="引き分け").length;
document.getElementById("total").textContent=data.length;
document.getElementById("wins").textContent=wins;
document.getElementById("losses").textContent=losses;
document.getElementById("rate").textContent=
 ((wins/(wins+losses))*100).toFixed(1)+"%";
[keyword,outcome,month].forEach(el=>el.addEventListener("input",render));
render();
</script>
