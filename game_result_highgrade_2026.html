.eyebrow{font-size:.78rem;letter-spacing:.16em;opacity:.85;margin:0 0 8px}

.header-sub{margin:12px 0 0;color:#dcecff;font-size:.95rem}
.container{padding:26px 0 48px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:0 3px 12px rgba(20,45,75,.04)}
.stat-label{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.stat-value{font-size:clamp(1.45rem,3vw,2rem);font-weight:800;color:var(--navy);line-height:1.2}
.stat-value small{font-size:.8rem;font-weight:600}
.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 190px;gap:10px;margin-bottom:18px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;font:inherit;background:#fff;color:var(--text);min-width:0}
input:focus,select:focus{outline:3px solid rgba(23,105,170,.15);border-color:var(--blue)}
.result-count{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.table-wrap{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(20,45,75,.04)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
thead{background:#eaf1f8;color:#183b60}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e8edf2;vertical-align:middle}
th{font-weight:700;white-space:nowrap}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
.date{white-space:nowrap;font-variant-numeric:tabular-nums;color:#475569}
.score{font-weight:800;font-size:1.02rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;min-width:3.2em;text-align:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800}
.win{color:var(--win);background:#e6f5ec}
.lose{color:var(--lose);background:#fdecec}
.draw{color:var(--draw);background:#fff4d9}
.competition{color:#536579;font-size:.83rem}
.empty{padding:32px;text-align:center;color:var(--muted)}
.note{margin:14px 2px 0;color:var(--muted);font-size:.8rem}
footer{text-align:center;color:#718096;font-size:.8rem;padding:20px}
@media(max-width:700px){
 .summary{grid-template-columns:repeat(2,1fr);gap:9px}
 .stat{padding:13px 8px}
 .toolbar{grid-template-columns:1fr}
 .table-wrap{overflow-x:auto}
 table{min-width:690px}
 th,td{padding:10px 11px}
 .site-header{padding-top:26px}
}
@media print{
 body{background:white}.back-link,.toolbar{display:none}.site-header{background:white;color:#12345a;padding:16px}.header-sub{color:#475569}.stat,.table-wrap{box-shadow:none}.container{width:100%;padding:10px}
}
</style>

["2026-11-08","小松フェニックス","4-5","負け","四ツ木橋野球場","練習試合①"],
["2026-11-08","小松フェニックス","2-7","負け","四ツ木橋野球場","練習試合②"],
["2026-11-15","稲田クラブ","9-0","勝ち","北区中央公園","北区ジュニア大会"],
["2026-11-22","馬込ジャガーズ","2-4","負け","リバーサイドスポーツセンター","台東区都知事杯"],
["2026-11-23","マッハブレーブス","10-0","勝ち","浮間子どもスポーツ広場","浮間大会"]
];

const tbody=document.getElementById('games');
const search=document.getElementById('search');
const month=document.getElementById('month');
const fmtDate=s=>{const [y,m,d]=s.split('-');return `${y}年${Number(m)}月${Number(d)}日`};
const months=[...new Set(games.map(g=>g[0].slice(0,7)))];
months.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=`${m.slice(0,4)}年${Number(m.slice(5))}月`;month.append(o)});
const w=games.filter(g=>g[3]==='勝ち').length,l=games.filter(g=>g[3]==='負け').length,d=games.filter(g=>g[3]==='引き分け').length;
document.getElementById('total').textContent=games.length;
document.getElementById('wins').textContent=w;
document.getElementById('losses').textContent=l;
document.getElementById('draws').textContent=d;
document.getElementById('rate').textContent=`${(w/(w+l)*100).toFixed(1)}%`;

function render(){
 const q=search.value.trim().toLocaleLowerCase();
 const m=month.value;
 const filtered=games.filter(g=>(!m||g[0].startsWith(m))&&(!q||g.join(' ').toLocaleLowerCase().includes(q)));
 tbody.replaceChildren();
 filtered.forEach(g=>{
  const tr=document.createElement('tr');
  const vals=[fmtDate(g[0]),g[5],g[1],g[2],g[3],g[4]];
  vals.forEach((v,i)=>{
   const td=document.createElement('td');
   if(i===0){td.className='date';td.textContent=v}
   else if(i===1){td.className='competition';td.textContent=v}
   else if(i===3){td.className='score';td.textContent=v}
   else if(i===4){const b=document.createElement('span');b.className='badge '+(v==='勝ち'?'win':v==='負け'?'lose':'draw');b.textContent=v;td.append(b)}
   else td.textContent=v;
   tr.append(td);
  });
  tbody.append(tr);
 });
 document.getElementById('count').textContent=`${filtered.length}試合を表示（全${games.length}試合）`;
 document.getElementById('empty').hidden=filtered.length!==0;
}
search.addEventListener('input',render);
month.addEventListener('change',render);
render();
</script>
</body>
</html>
