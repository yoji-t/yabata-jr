<style>
:root {
  --navy:#102b49;

  --white:#fff;
  --text:#243449;
  --muted:#718096;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans JP",sans-serif;
}
a {color:inherit}
.home {
  display:block;
  background:var(--navy);
  color:white;
  padding:13px 20px;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}
.home:hover {background:var(--blue)}
.hero {
  background:linear-gradient(135deg,#102b49,#205d8b);
  color:white;
  padding:48px 20px 42px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero:after {
  content:"BASEBALL";
  position:absolute;
  font-size:100px;
  font-weight:900;
  color:rgba(255,255,255,.045);
  right:-10px;
  bottom:-15px;
  transform:rotate(-8deg);
}
.hero .tag {
  color:var(--gold);
  font-size:12px;
  font-weight:bold;
  letter-spacing:3px;
}
.hero h1 {
  font-size:clamp(27px,5vw,43px);
  margin:12px 0;
  font-weight:900;
}
.hero p {
  margin:0;
  color:#d8e6f4;
  font-size:14px;
}
.container {
  max-width:1100px;
  margin:0 auto;
  padding:25px 18px 55px;
}
.section-title {
  font-size:19px;
  font-weight:900;
  margin:32px 0 16px;
  border-left:5px solid var(--gold);
  padding-left:12px;
}
.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.card {
  background:white;
  border-radius:12px;
  padding:19px 12px;
  text-align:center;
  box-shadow:0 3px 12px rgba(20,40,70,.06);
}
.card small {
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:bold;
}
.card strong {
  display:block;
  font-size:32px;
  margin-top:7px;
  font-weight:900;
  color:var(--navy);
}
.card .unit {font-size:13px}
.card.win strong {color:#23966b}
.card.loss strong {color:var(--red)}
.card.draw strong {color:#c18b24}
.rate {
  background:white;
  border-radius:12px;
  padding:20px;
  margin-top:14px;
  box-shadow:0 3px 12px rgba(20,40,70,.05);
}
.rate-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-weight:bold;
}
.rate-head strong {
  font-size:27px;
  color:#23966b;
}
.bar {
  height:13px;
  background:#e8edf2;
  border-radius:20px;
  overflow:hidden;
  margin-top:13px;
}
.bar span {
  display:block;
  height:100%;
  background:#23966b;
  border-radius:20px;
}
.controls {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.controls input,.controls select {
  border:1px solid #d9e1e9;
  background:white;
  border-radius:8px;
  padding:12px;
  font-size:14px;
  min-width:0;
}
.controls input {flex:1;min-width:180px}
.controls select {min-width:130px}
.results {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.game {
  background:white;
  border-radius:11px;
  padding:15px;
  box-shadow:0 2px 8px rgba(20,40,70,.045);
  border:1px solid #e8edf2;
}
.game-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.date {
  font-size:12px;
  color:var(--muted);
  font-weight:bold;
}
.badge {
  font-size:11px;
  font-weight:900;
  padding:5px 11px;
  border-radius:20px;
}
.badge.win {background:#e2f5ec;color:#168454}
.badge.loss {background:#ffebeb;color:#c63d3d}
.badge.draw {background:#fff3d8;color:#a87815}
.tournament {
  font-size:12px;
  color:#65778a;
  margin-top:12px;
}
.match {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:11px 0;
}
.team {
  font-weight:800;
  font-size:14px;
  line-height:1.5;
}
.score {
  font-size:25px;
  font-weight:900;
  color:var(--navy);
  white-space:nowrap;
}
.score small {
  font-size:12px;
  color:var(--muted);
  font-weight:normal;
}
.place {
  border-top:1px solid #edf0f4;
  padding-top:10px;
  font-size:11px;
  color:var(--muted);
}
.empty {
  grid-column:1/-1;
  text-align:center;
  padding:35px;
  color:var(--muted);
  background:white;
  border-radius:12px;
}
.count {
  color:var(--muted);
  font-size:13px;
  margin:0 0 12px;
}
footer {
  background:var(--navy);
  color:#c8d6e5;
  text-align:center;
  padding:25px 15px;
  font-size:12px;
}
footer a {color:white}
@media(max-width:650px) {
  .cards {grid-template-columns:repeat(2,1fr)}
  .results {grid-template-columns:1fr}
  .hero {padding:38px 15px}
  .container {padding:18px 13px 40px}
  .card strong {font-size:28px}
}
</style>
</head>

// 勝敗の集計
function updateStats() {
  const wins = games.filter(g => g[4] === "勝ち").length;
  const losses = games.filter(g => g[4] === "負け").length;
  const draws = games.filter(g => g[4] === "引き分け").length;
  const rate = wins + losses ? wins / (wins + losses) * 100 : 0;

  document.getElementById("total").textContent = games.length;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("draws").textContent = draws;
  document.getElementById("rate").textContent = rate.toFixed(1) + "%";
  document.getElementById("ratebar").style.width = rate + "%";
}

// 試合一覧の表示
function render() {
  const keyword = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;
  const year = document.getElementById("year").value;

  const filtered = games.filter(g => {
    const text = g.join(" ").toLowerCase();
    return text.includes(keyword) &&
      (filter === "all" || g[4] === filter) &&
      (year === "all" || g[0].startsWith(year));
  }).slice().reverse();

  document.getElementById("count").textContent =
    "表示中：" + filtered.length + "試合";

  const html = filtered.map(g => {
    const [date,event,opponent,score,result,place] = g;
    const cls = result === "勝ち" ? "win" :
                result === "負け" ? "loss" : "draw";

    const d = new Date(date + "T00:00:00");
    const formatted =
      d.getFullYear() + "年" +
      (d.getMonth()+1) + "月" +
      d.getDate() + "日";

    return `
      <article class="game">
        <div class="game-top">
          <span class="date">${formatted}</span>
          <span class="badge ${cls}">${result}</span>
        </div>
        <div class="tournament">${event}</div>
        <div class="match">
          <span class="team">谷端ジュニア<br>VS ${opponent}</span>
          <span class="score">${score}</span>
        </div>
        <div class="place">📍 ${place}</div>
      </article>
    `;
  }).join("");

  document.getElementById("results").innerHTML =
    html || '<div class="empty">該当する試合はありません。</div>';
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("filter").addEventListener("change",render);
document.getElementById("year").addEventListener("change",render);

updateStats();
render();
</script>
