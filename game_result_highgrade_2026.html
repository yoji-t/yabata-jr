:root{

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--text);font-size:16px;line-height:1.5;

  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:24px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:32px}
.home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border);
  border-radius:999px;background:var(--soft);color:var(--text);text-decoration:none;font-size:15px;font-weight:550}
.home:hover{background:var(--surface2)}
.home svg{flex:none}
.updated{font-size:14px;color:var(--text2)}

/* header */
.eyebrow{margin:0 0 8px;font-size:14px;letter-spacing:.08em;color:var(--text2);font-variant-numeric:tabular-nums}
h1{margin:0;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
@media (min-width:768px){h1{font-size:38px}}
h1 .sub{display:block;font-size:.62em;font-weight:600;color:var(--text2);margin-top:6px;letter-spacing:0}
.lede{margin:16px 0 0;font-size:16px;color:var(--text2);max-width:46em}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:32px 0 0}
@media (min-width:600px){.kpis{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{margin:0;padding:16px;background:var(--soft);border:1px solid var(--border);border-radius:var(--radius)}
.kpi-label{margin:0 0 4px;font-size:14px;color:var(--text2)}
.kpi-value{margin:0;font-size:28px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-value .unit{font-size:15px;font-weight:600;margin-left:2px}
.kpi.win .kpi-value{color:var(--win)}
.kpi.loss .kpi-value{color:var(--loss)}

/* panels */
.panels{display:grid;gap:16px;margin-top:32px}
.panels>*{min-width:0}
@media (min-width:900px){.panels{grid-template-columns:1fr 1fr;gap:24px}}
.panel{min-width:0;margin:0;padding:20px;background:var(--soft);border:1px solid var(--border);border-radius:var(--radius)}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.panel h2{margin:0;font-size:17px;font-weight:650;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel-kpi{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.panel .figure-note{margin:0 0 20px;font-size:14px;color:var(--text2)}

/* monthly bars */
.mrows{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:52px 1fr 46px 50px;align-items:center;gap:8px;padding:2px 0}
.mrow-lab{font-size:14px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow-track{position:relative;display:block;height:12px;border-radius:3px;background:var(--surface2)}
.mrow-track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px dashed var(--text2);opacity:.55}
.mrow-bar{display:block;height:100%;border-radius:3px;background:var(--accent)}
.mrow-val{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mrow-sub{font-size:14px;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.empty-note{margin:0;padding:24px 0;font-size:15px;color:var(--text2)}

/* cumulative */
.cum{width:100%;min-width:0}
.cum svg{display:block;width:100%;height:auto;overflow:visible}
.cum-grid{stroke:var(--border);stroke-width:1}
.cum-zero{stroke:var(--border);stroke-width:1}
.cum-area{fill:var(--accent);opacity:.10}
.cum-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cum-dot{fill:var(--accent)}
.cum-tick{fill:var(--text2);font-size:14px;font-variant-numeric:tabular-nums}
.cum-end{fill:var(--text);font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}

/* filters + table */
.tablecard{margin-top:32px;background:var(--soft);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.filters{display:grid;gap:12px}
@media (min-width:768px){.filters{grid-template-columns:auto 1fr 1fr 1fr}}
.seg{display:inline-flex;padding:4px;gap:4px;background:var(--canvas);border:1px solid var(--border);border-radius:999px}
.seg button{min-height:44px;min-width:72px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--text2);
  font:inherit;font-size:15px;font-weight:550;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--canvas)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--text2)}
select,input[type=search]{min-height:44px;width:100%;padding:0 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--canvas);color:var(--text);font:inherit;font-size:16px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.filterbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 12px;
  padding-top:16px;border-top:1px solid var(--border)}
.count{margin:0;font-size:15px;color:var(--text2)}
.count b{color:var(--text);font-variant-numeric:tabular-nums}
.reset{min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:8px;background:var(--canvas);
  color:var(--text);font:inherit;font-size:15px;cursor:pointer}
.reset:hover{background:var(--surface2)}

.tablewrap{display:none;overflow:auto;max-height:min(72vh,760px);border:1px solid var(--border);border-radius:8px;background:var(--canvas)}
@media (min-width:768px){.tablewrap{display:block}}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th{position:sticky;top:0;z-index:1;background:var(--canvas);font-size:14px;font-weight:600;color:var(--text2);
  border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
th button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0;border:0;background:none;
  color:inherit;font:inherit;font-weight:600;cursor:pointer}
td.c-date{font-variant-numeric:tabular-nums}
td.c-date .wd{font-size:14px;color:var(--text2);margin-left:4px}
td.c-opp{font-weight:600}
td.c-score{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
td.c-score .s-dash{font-weight:400;color:var(--text2);margin:0 6px}
td.c-score .s-opp{font-weight:600;color:var(--text2)}
td.c-score .s-note{font-size:14px;font-weight:400;color:var(--text2);margin-left:6px}
td.c-venue,td.c-tour{color:var(--text2);white-space:normal}
td.c-venue{color:var(--text)}
td.c-tour{min-width:120px}
td.c-venue{min-width:120px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:26px;padding:0 10px;

.badge.win{background:var(--win-bg);color:var(--win)}
.badge.loss{background:var(--loss-bg);color:var(--loss)}

</head>

const WD = ['日','月','火','水','木','金','土'];
const DATA = RAW.map(function (r, i) {
  var m = /(\d+)\s*[-−–ー]\s*(\d+)/.exec(r[4]) || [];
  return {
    seq: i, date: r[0], tournament: r[1], opponent: r[2], result: r[3], score: r[4], venue: r[5],
    own: m[1] ? +m[1] : 0, opp: m[2] ? +m[2] : 0,
    note: (/(\([^)]*\))/.exec(r[4]) || [''])[0]
  };
});

const state = { res: 'all', tour: 'all', opp: 'all', venue: 'all', desc: true };

const $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function dp(iso) {
  var p = iso.split('-').map(Number);
  return { y: p[0], m: p[1], d: p[2], wd: WD[new Date(p[0], p[1] - 1, p[2]).getDay()] };
}
function dateLabel(iso) {
  var p = dp(iso);
  return p.y + '.' + String(p.m).padStart(2, '0') + '.' + String(p.d).padStart(2, '0');
}

/* ---------- filtering ---------- */
function current() {
  return DATA.filter(function (g) {
    if (state.res !== 'all' && g.result !== state.res) return false;
    if (state.tour !== 'all' && g.tournament !== state.tour) return false;
    if (state.opp !== 'all' && g.opponent !== state.opp) return false;
    if (state.venue !== 'all' && g.venue !== state.venue) return false;
    return true;
  });
}

/* ---------- kpi ---------- */
function renderKpi(gs) {
  var n = gs.length;
  var w = gs.filter(function (g) { return g.result === '勝'; }).length;
  var l = n - w;
  var own = 0, opp = 0;
  gs.forEach(function (g) { own += g.own; opp += g.opp; });
  $('k-n').textContent = n;
  $('k-w').textContent = w;
  $('k-l').textContent = l;
  $('k-rate').innerHTML = (w + l ? (w / (w + l) * 100).toFixed(1) : '0.0') + '<span class="unit">%</span>';
  $('k-own').innerHTML = (n ? own / n : 0).toFixed(1) + '<span class="unit">点</span>';
  $('k-opp').innerHTML = (n ? opp / n : 0).toFixed(1) + '<span class="unit">点</span>';
  $('count').innerHTML = '全 <b>' + DATA.length + '</b> 試合中 <b>' + n + '</b> 試合を表示';
}

/* ---------- monthly win-rate rows ---------- */
function renderMonthly(gs) {
  var host = $('mchart');
  var map = new Map();
  gs.forEach(function (g) {
    var k = g.date.slice(0, 7);
    var o = map.get(k) || { w: 0, l: 0 };
    if (g.result === '勝') o.w++; else o.l++;
    map.set(k, o);
  });
  var keys = Array.from(map.keys()).sort();
  if (!keys.length) {
    host.innerHTML = '<p class="empty-note">該当する試合がありません。</p>';
    host.setAttribute('aria-label', '該当する試合がありません');
    return;
  }
  var html = '<div class="mrows">';
  var spoken = [];
  keys.forEach(function (k, i) {
    var o = map.get(k), tot = o.w + o.l;
    var rate = tot ? o.w / tot : 0;
    var pct = Math.round(rate * 100);
    var mm = +k.slice(5, 7), yy = k.slice(2, 4);
    var label = (i === 0 || mm === 1) ? yy + '/' + mm : mm + '月';
    html += '<div class="mrow">' +
      '<span class="mrow-lab">' + label + '</span>' +
      '<span class="mrow-track"><span class="mrow-bar" style="width:' + Math.max(pct, pct > 0 ? 1 : 0) + '%"></span></span>' +
      '<span class="mrow-val">' + pct + '%</span>' +
      '<span class="mrow-sub">' + tot + '試合</span>' +
      '</div>';
    spoken.push(dp(k + '-01').y + '年' + mm + '月 ' + pct + 'パーセント（' + o.w + '勝' + o.l + '敗）');
  });
  html += '</div>';
  host.innerHTML = html;
  host.setAttribute('aria-label', '月別の勝率。' + spoken.join('、') + '。');
}

/* ---------- cumulative run differential ---------- */
function niceStep(max, target) {
  var raw = max / target;
  var pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  var c = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < c.length; i++) if (c[i] * pow >= raw) return c[i] * pow;
  return 10 * pow;
}
function renderCum(gs) {
  var host = $('cum');
  var cum = [], acc = 0;
  gs.forEach(function (g) { acc += g.own - g.opp; cum.push(acc); });
  var n = cum.length;
  $('cum-total').textContent = (acc > 0 ? '+' : '') + acc;

  var W = Math.max(280, host.clientWidth || 480);
  var H = 330, pad = { t: 18, r: 56, b: 32, l: 48 };
  var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

  if (!n) {
    host.innerHTML = '<p class="empty-note">該当する試合がありません。</p>';
    host.setAttribute('aria-label', '該当する試合がありません');
    return;
  }

  var top = Math.max.apply(null, cum);
  var bottom = Math.min.apply(null, cum);
  var step = niceStep(Math.max(top, 1) - Math.min(bottom, 0), 4);
  var yMax = top > 0 ? Math.ceil(top / step) * step : 0;
  var yMin = bottom < 0 ? Math.floor(bottom / step) * step : 0;
  if (yMax === yMin) yMax = yMin + step;
  var yFor = function (v) { return pad.t + ph * (1 - (v - yMin) / (yMax - yMin)); };
  var xFor = function (i) { return pad.l + (n > 1 ? pw * i / (n - 1) : pw / 2); };

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' +
    '得失点差の累積。' + n + '試合で' + (acc >= 0 ? 'プラス' : 'マイナス') + Math.abs(acc) + '点。">';

  for (var v = yMin; v <= yMax + 0.001; v += step) {
    var y = yFor(v);
    s += '<line class="' + (v === 0 ? 'cum-zero' : 'cum-grid') + '" x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + pw) + '" y2="' + y + '"/>';
    s += '<text class="cum-tick" x="' + (pad.l - 10) + '" y="' + (y + 5) + '" text-anchor="end">' + v + '</text>';
  }

  var d = '';
  cum.forEach(function (val, i) { d += (i ? 'L' : 'M') + xFor(i).toFixed(1) + ' ' + yFor(val).toFixed(1); });
  var base = yFor(0);
  s += '<path class="cum-area" d="' + d + 'L' + xFor(n - 1).toFixed(1) + ' ' + base + 'L' + xFor(0).toFixed(1) + ' ' + base + 'Z"/>';
  s += '<path class="cum-line" d="' + d + '"/>';

  /* month ticks */
  var seen = {}, positions = [];
  gs.forEach(function (g, i) {
    var k = g.date.slice(0, 7);
    if (!seen[k]) { seen[k] = 1; positions.push({ i: i, k: k }); }
  });
  var placed = [];
  positions.forEach(function (p) {
    var x = xFor(p.i), mm = +p.k.slice(5, 7);
    var lab = (p.i === 0 || mm === 1) ? p.k.slice(2, 4) + '/' + mm : mm + '月';
    var half = (lab.length * 8 + 10) / 2;
    var prev = placed[placed.length - 1];
    if (prev && x - prev.x < prev.half + half) return;
    if (x + half > pad.l + pw) return;
    placed.push({ x: x, half: half });
    s += '<text class="cum-tick" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + lab + '</text>';
  });

  var ex = xFor(n - 1), ey = yFor(cum[n - 1]);
  s += '<circle class="cum-dot" cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="3.5"/>';
  s += '<text class="cum-end" x="' + (ex + 10).toFixed(1) + '" y="' + (ey + 5).toFixed(1) + '">' + (acc > 0 ? '+' : '') + acc + '</text>';
  s += '</svg>';
  host.innerHTML = s;
}

/* ---------- table ---------- */
function scoreCell(g, cls) {
  var note = g.note ? '<span class="s-note">' + esc(g.note) + '</span>' : '';
  return '<span class="s-own">' + g.own + '</span><span class="s-dash">-</span><span class="s-opp">' + g.opp + '</span>' + note;
}
function renderTable(gs) {
  var rows = gs.slice().sort(function (a, b) {
    var c = a.date.localeCompare(b.date);
    if (c === 0) return a.seq - b.seq;
    return state.desc ? -c : c;
  });
  var tb = $('tbody'), cards = $('cards');
  if (!rows.length) {
    tb.innerHTML = '<tr><td class="empty" colspan="6">条件に一致する試合がありません。</td></tr>';
    cards.innerHTML = '<li class="card"><p class="card-meta">条件に一致する試合がありません。</p></li>';
    return;
  }
  var th = '', ch = '';
  rows.forEach(function (g) {
    var p = dp(g.date);
    var badge = '<span class="badge ' + (g.result === '勝' ? 'win' : 'loss') + '">' + g.result + '</span>';
    th += '<tr><td class="c-date">' + dateLabel(g.date) + '<span class="wd">(' + p.wd + ')</span></td>' +
      '<td class="c-tour">' + esc(g.tournament) + '</td>' +
      '<td class="c-opp">' + esc(g.opponent) + '</td>' +
      '<td class="c-score">' + scoreCell(g) + '</td>' +
      '<td class="c-res">' + badge + '</td>' +
      '<td class="c-venue">' + esc(g.venue) + '</td></tr>';
    ch += '<li class="card"><div class="card-top">' + badge + '<span class="card-date">' + dateLabel(g.date) + ' (' + p.wd + ')</span></div>' +
      '<p class="card-opp">' + esc(g.opponent) + '</p>' +
      '<p class="card-meta">' + esc(g.tournament) + ' ・ ' + esc(g.venue) + '</p>' +
      '<p class="card-score">' + scoreCell(g) + '</p></li>';
  });
  tb.innerHTML = th;
  cards.innerHTML = ch;
}

function render() {
  var gs = current();
  renderKpi(gs);
  renderMonthly(gs);
  renderCum(gs);
  renderTable(gs);
}

/* ---------- controls ---------- */
function fillSelect(sel, values, allLabel) {
  var counts = {};
  values.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
  var opts = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, 'ja'); });
  sel.innerHTML = '<option value="all">' + allLabel + '</option>' +
    opts.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '（' + counts[v] + '）</option>'; }).join('');
}
fillSelect($('f-tour'), DATA.map(function (g) { return g.tournament; }), 'すべての大会');
fillSelect($('f-opp'), DATA.map(function (g) { return g.opponent; }), 'すべての相手');
fillSelect($('f-venue'), DATA.map(function (g) { return g.venue; }), 'すべての会場');

document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    b.setAttribute('aria-pressed', 'true');
    state.res = b.dataset.res;
    render();
  });
});
$('f-tour').addEventListener('change', function (e) { state.tour = e.target.value; render(); });
$('f-opp').addEventListener('change', function (e) { state.opp = e.target.value; render(); });
$('f-venue').addEventListener('change', function (e) { state.venue = e.target.value; render(); });

$('sort-btn').addEventListener('click', function () {
  state.desc = !state.desc;
  $('sort-icon').textContent = state.desc ? '↓' : '↑';
  $('sort-btn').setAttribute('aria-label', '日付で並べ替え（現在' + (state.desc ? '新しい順' : '古い順') + '）');
  renderTable(current());
});

$('reset').addEventListener('click', function () {
  state.res = 'all'; state.tour = 'all'; state.opp = 'all'; state.venue = 'all';
  document.querySelectorAll('.seg button').forEach(function (x) {
    x.setAttribute('aria-pressed', x.dataset.res === 'all' ? 'true' : 'false');
  });
  $('f-tour').value = 'all'; $('f-opp').value = 'all'; $('f-venue').value = 'all';
  render();
});

var raf = 0;
window.addEventListener('resize', function () {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(function () { renderCum(current()); });
});

render();
